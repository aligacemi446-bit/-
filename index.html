
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>NEON | Welcome</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f5f7ff;
      background:
        radial-gradient(ellipse at 50% 0%, #17265a 0%, transparent 55%),
        #080b16;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 32px 26px;
      border: 1px solid #334c83;
      border-radius: 22px;
      background: rgba(12, 18, 38, 0.94);
      box-shadow: 0 0 35px #245bff20,
                  inset 0 0 25px #1d3c7a12;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border: 1px solid #5a8cff;
      border-radius: 18px;
      color: #8fb4ff;
      font-size: 27px;
      font-weight: bold;
      box-shadow: 0 0 22px #3477ff55;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 12px 0 28px;
      color: #9eaccd;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin: 17px 0 9px;
      font-size: 14px;
      color: #dce5ff;
    }

    input {
      width: 100%;
      padding: 14px;
      color: white;
      background: #0a1022;
      border: 1px solid #2c3b60;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #6896ff;
      box-shadow: 0 0 13px #367aff35;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
      color: #aab7d4;
      font-size: 12px;
      line-height: 1.8;
    }

    .consent input {
      width: 16px;
      height: 16px;
      margin-top: 3px;
      accent-color: #668bff;
      flex-shrink: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      color: white;
      background: linear-gradient(100deg, #3567f6, #8157ff);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px #416bff40;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .notice {
      min-height: 20px;
      margin: 15px 0 0;
      color: #a9c4ff;
      font-size: 13px;
      text-align: center;
      line-height: 1.7;
    }

    .footer {
      margin-top: 24px;
      color: #647397;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">N</div>

    <h1>WELCOME</h1>

    <p class="subtitle">
      مرحباً بك في عالم NEON<br>
      أدخل اسمك ولقبك للمتابعة
    </p>

    <form id="welcomeForm">
      <label for="firstName">الاسم</label>
      <input
        id="firstName"
        name="firstName"
        type="text"
        placeholder="اكتب اسمك"
        maxlength="60"
        autocomplete="given-name"
        required
      >

      <label for="lastName">اللقب</label>
      <input
        id="lastName"
        name="lastName"
        type="text"
        placeholder="اكتب لقبك"
        maxlength="60"
        autocomplete="family-name"
        required
      >

      <label class="consent">
        <input id="consent" type="checkbox" required>
        <span>
          أوافق على حفظ اسمي ولقبي وإرسالهما إلى صاحب الموقع
          وفق سياسة الخصوصية الخاصة به.
        </span>
      </label>

      <button type="submit">متابعة ←</button>

      <p class="notice" id="notice" role="status"></p>
    </form>

    <div class="footer">
      NEON SYSTEM · WELCOME PORTAL
    </div>
  </main>

  <script>
    const form = document.getElementById("welcomeForm");
    const notice = document.getElementById("notice");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      notice.textContent =
        "الواجهة جاهزة! سنفعّل التسجيل الآمن في الخطوة التالية.";
    });
  </script>
</body>
</html>
