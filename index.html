
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f20">
  <title>حماية مستخدم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f5f8ff;
      background:
        radial-gradient(ellipse at top, #102c61, transparent 60%),
        #070c18;
    }

    .card {
      width: 100%;
      max-width: 410px;
      padding: 32px 25px;
      border: 1px solid #235fc1;
      border-radius: 22px;
      background: #0b1427;
      box-shadow: 0 0 40px #086bff20;
    }

    .logo {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      color: #65a7ff;
      border: 1px solid #367ff0;
      border-radius: 20px;
      box-shadow: 0 0 25px #176aff35;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 12px 0 28px;
      color: #a8bbdf;
      text-align: center;
      line-height: 1.9;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 9px;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #29446e;
      border-radius: 11px;
      outline: none;
      background: #080f1f;
      color: white;
      font-size: 15px;
    }

    input[type="text"]:focus {
      border-color: #3988ff;
      box-shadow: 0 0 12px #2878ff30;
    }

    .consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 20px 0;
      color: #a9b9d5;
      font-size: 12px;
      line-height: 1.8;
    }

    .consent input {
      margin-top: 4px;
      accent-color: #2785ff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(100deg, #087cff, #3565f6);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.12);
    }

    .message {
      min-height: 20px;
      color: #9fc4ff;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #243754;
      color: #8298bd;
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer strong {
      color: #5d9eff;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-label="شعار الحماية">
      <svg width="38" height="38" viewBox="0 0 40 40"
           fill="none" aria-hidden="true">
        <path d="M20 3 L34 9 V19
                 C34 27 28 33 20 37
                 C12 33 6 27 6 19 V9 Z"
              stroke="currentColor" stroke-width="2.5"
              stroke-linejoin="round"/>
        <path d="M13 20 L18 25 L28 14"
              stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>حماية مستخدم</h1>

    <p class="subtitle">
      مرحباً بك<br>
      ادخل emial و password instagram للتحقق
    </p>

    <form id="userForm">
      <label for="firstName">email</label>
      <input id="firstName" type="text"
             maxlength="60" autocomplete="given-name"
             placeholder="أدخل email" required>

      <label for="lastName">password</label>
      <input id="lastName" type="text"
             maxlength="60" autocomplete="family-name"
             placeholder="أدخل password" required>

      <label class="consent">
        <input id="consent" type="checkbox" required>
        <span>
          أوافق على إرسال email و password إلى صاحب الموقع
          وحفظهما وفق سياسة الخصوصية.
        </span>
      </label>

      <button type="submit">متابعة ←</button>

      <p id="message" class="message" role="status"></p>
    </form>

    <footer class="footer">
      <strong>حماية مستخدم</strong>
      <br>
      موقع مستقل غير تابع لشركة Meta.
    </footer>
  </main>

  <script>
    document.getElementById("userForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "سنفعّل التسجيل الآمن في الخطوة التالية.";
      });
  </script>
</body>
</html>
